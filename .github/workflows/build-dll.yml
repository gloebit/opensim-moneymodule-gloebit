name: Build Gloebit DLL

on:
  push:
    tags:
      - 'build-*'
  schedule:
    # Weekly build against OpenSim master, published as the rolling "opensim-master-weekly" pre-release.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      opensim_versions:
        description: 'Comma-separated OpenSim refs to build against'
        required: false
        default: '0.9.3.0,0.9.3.1Dev,master'
      publish_weekly:
        description: 'Also replace the opensim-master-weekly pre-release with this run''s master DLLs'
        type: boolean
        required: false
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WEEKLY_TAG: opensim-master-weekly

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    outputs:
      opensim_versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSIONS="${{ github.event.inputs.opensim_versions }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            VERSIONS="master"
          else
            VERSIONS="0.9.3.0,0.9.3.1Dev,master"
          fi
          JSON=$(echo "$VERSIONS" | jq -R -c 'split(",")')
          echo "versions=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix:
        opensim_version: ${{ fromJson(needs.matrix-setup.outputs.opensim_versions) }}
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # OpenSim master moves daily. On a tagged release its failure must not block the
    # 0.9.3.x DLLs; on the weekly schedule it should fail the run so we hear about it.
    continue-on-error: ${{ matrix.opensim_version == 'master' && github.event_name != 'schedule' }}
    steps:
      - name: Checkout Gloebit module
        uses: actions/checkout@v4

      - name: Checkout OpenSim
        uses: actions/checkout@v4
        with:
          repository: opensim/opensim
          ref: ${{ matrix.opensim_version }}
          path: opensim

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Install libgdiplus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgdiplus

      - name: Install libgdiplus (macOS)
        if: runner.os == 'macOS'
        run: brew install mono-libgdiplus

      - name: Copy Gloebit module into OpenSim
        shell: bash
        run: cp -r addon-modules/Gloebit opensim/addon-modules/

      - name: Setup System.Drawing.Common
        working-directory: opensim
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp bin/System.Drawing.Common.dll.win bin/System.Drawing.Common.dll
          else
            cp bin/System.Drawing.Common.dll.linux bin/System.Drawing.Common.dll
          fi

      - name: Run prebuild (Windows)
        if: runner.os == 'Windows'
        working-directory: opensim
        shell: cmd
        run: dotnet bin\prebuild.dll /target vs2022 /file prebuild.xml

      - name: Run prebuild (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: opensim
        shell: bash
        run: dotnet bin/prebuild.dll /target vs2022 /file prebuild.xml

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: opensim
        shell: cmd
        run: dotnet build --configuration Release OpenSim.sln

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: opensim
        shell: bash
        run: dotnet build --configuration Release OpenSim.sln

      - name: Get build info
        id: info
        shell: bash
        run: |
          GLOEBIT_HASH=$(git rev-parse --short HEAD)
          OPENSIM_SHA=$(cd opensim && git rev-parse HEAD)
          OPENSIM_SHORT=$(cd opensim && git rev-parse --short HEAD)
          OPENSIM_DATE=$(cd opensim && git log -1 --format=%cs HEAD)
          DATE=$(date +%Y-%m-%d)
          OS_SHORT="${{ matrix.os }}"
          OS_SHORT="${OS_SHORT/ubuntu-latest/linux}"
          OS_SHORT="${OS_SHORT/windows-latest/windows}"
          OS_SHORT="${OS_SHORT/macos-latest/macos}"
          OPENSIM_LABEL="${{ matrix.opensim_version }}"
          if [ "$OPENSIM_LABEL" = "master" ]; then
            # master moves daily: name the exact OpenSim commit and its date
            OPENSIM_LABEL="master-${OPENSIM_SHORT}-${OPENSIM_DATE}"
          fi
          DLL_NAME="Gloebit--${OPENSIM_LABEL}--${OS_SHORT}--${DATE}--${GLOEBIT_HASH}.dll"
          echo "dll_name=$DLL_NAME" >> "$GITHUB_OUTPUT"
          echo "os_short=$OS_SHORT" >> "$GITHUB_OUTPUT"
          # one line per build, collected into the release notes
          mkdir -p info
          printf '%s|%s|%s\n' "${{ matrix.opensim_version }}" "$OPENSIM_SHA" "$OPENSIM_DATE" \
            > "info/opensim-${{ matrix.opensim_version }}-${OS_SHORT}.txt"

      - name: Rename and upload DLL
        shell: bash
        run: |
          cp opensim/bin/Gloebit.dll "${{ steps.info.outputs.dll_name }}"
          echo "Built: ${{ steps.info.outputs.dll_name }}"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Gloebit-${{ matrix.opensim_version }}-${{ steps.info.outputs.os_short }}
          path: ${{ steps.info.outputs.dll_name }}

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: info-${{ matrix.opensim_version }}-${{ steps.info.outputs.os_short }}
          path: info/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/build-')
    permissions:
      contents: write
    steps:
      - name: Download DLLs
        uses: actions/download-artifact@v4
        with:
          path: dlls
          pattern: Gloebit-*
          merge-multiple: true

      - name: Download build info
        uses: actions/download-artifact@v4
        with:
          path: info
          pattern: info-*
          merge-multiple: true

      - name: Write release notes
        run: |
          find dlls -name "*.dll" -type f | sort
          {
            echo "Gloebit Money Module DLLs for OpenSim 0.9.3.x (.NET 8). Platforms: Linux, Windows, macOS."
            echo
            echo "## Built against"
            echo "| OpenSim | Commit | Commit date |"
            echo "|---|---|---|"
            cat info/*.txt | sort -u | while IFS='|' read -r ref sha date; do
              echo "| \`$ref\` | [\`${sha:0:10}\`](https://github.com/opensim/opensim/commit/$sha) | $date |"
            done
            echo
            if ls dlls/Gloebit--master-* >/dev/null 2>&1; then
              echo "The \`master\` DLLs are built against the OpenSim master commit above (also in the file name)."
              echo "Use them if you run a recent OpenSim dev build. Master changes often; a newer DLL is published"
              echo "weekly as the [\`$WEEKLY_TAG\`](https://github.com/${{ github.repository }}/releases/tag/$WEEKLY_TAG) pre-release."
            else
              echo "No \`master\` DLLs in this release: the build against OpenSim master failed."
            fi
            echo
            echo "## Installation"
            echo "1. Download the DLL matching your OpenSim version and platform"
            echo "2. Copy to your OpenSim \`bin/\` directory"
            echo "3. Configure per [instructions](http://dev.gloebit.com/opensim/configuration-instructions/)"
            echo
            echo "If your exact version isn't listed, try the closest match or [build from source](https://github.com/${{ github.repository }})."
          } > notes.md
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dlls/*
          fail_on_unmatched_files: false

  weekly-master:
    # Replaces the rolling pre-release with this run's master DLLs.
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_weekly == 'true')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download master DLLs
        uses: actions/download-artifact@v4
        with:
          path: dlls
          pattern: Gloebit-master-*
          merge-multiple: true

      - name: Download master build info
        uses: actions/download-artifact@v4
        with:
          path: info
          pattern: info-master-*
          merge-multiple: true

      - name: Replace the weekly pre-release
        run: |
          COUNT=$(find dlls -name "*.dll" -type f | wc -l)
          if [ "$COUNT" -ne 3 ]; then
            echo "expected 3 master DLLs (linux, windows, macos), got $COUNT; keeping last week's pre-release" >&2
            exit 1
          fi
          IFS='|' read -r ref sha date < <(cat info/*.txt | sort -u | head -1)
          {
            echo "Gloebit Money Module DLLs built against **OpenSim master** at"
            echo "[\`${sha:0:10}\`](https://github.com/opensim/opensim/commit/$sha), committed $date."
            echo
            echo "Rebuilt every week from the latest Gloebit module and the latest OpenSim master, so it"
            echo "replaces itself. For an OpenSim release (0.9.3.0), use the latest numbered \`build-*\` release instead."
            echo
            echo "Module commit: [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/$GITHUB_SHA). Built $(date -u +%Y-%m-%d)."
          } > notes.md
          gh release delete "$WEEKLY_TAG" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create "$WEEKLY_TAG" dlls/*.dll --repo "${{ github.repository }}" --prerelease \
            --target "$GITHUB_SHA" \
            --title "OpenSim master weekly: OpenSim ${sha:0:7} ($date)" \
            --notes-file notes.md
